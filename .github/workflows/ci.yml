name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    # 24.04, not latest: 26.04 has no Python 3.9 for setup-python, nor a Chromium Playwright supports
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile dmrdash.py rxoffset.py rflevel.py master.py power.py update.py config.py tui.py
      - run: python -m unittest discover -s tests -v

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh packaging/build-deb.sh packaging/apt-repo.sh packaging/postinst packaging/prerm packaging/postrm tests/apt-e2e.sh

  # install.sh → the package from a signed apt repo → an update through update.py → remove and purge
  apt:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - run: sh tests/apt-e2e.sh "$GITHUB_WORKSPACE"

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
