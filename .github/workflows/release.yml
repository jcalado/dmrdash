name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # the runner CI tests on
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches VERSION in dmrdash.py
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' dmrdash.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but dmrdash.py says $v"; exit 1; }
      - run: python3 -m unittest discover -s tests
      - name: Build
        run: |
          mkdir -p dist/stage/dmrdash
          cp -r dmrdash.py index.html rxoffset.py rflevel.py master.py power.py update.py tui.py dmrdash.service dmrdash-rxoffset.path dmrdash-rxoffset.service dmrdash-master.path dmrdash-master.service \
                dmrdash-power.path dmrdash-power.service dmrdash-rflevel.path dmrdash-rflevel.service dmrdash-update.path dmrdash-update.service \
                dmrdash.conf.example install.sh packaging \
                README.md LICENSE NOTICE licenses vendor dist/stage/dmrdash/
          tar -czf dist/dmrdash.tar.gz -C dist/stage dmrdash
          cp install.sh dist/install.sh
          packaging/build-deb.sh
          (cd dist && sha256sum dmrdash.tar.gz install.sh dmrdash_*_all.deb > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/dmrdash.tar.gz dist/install.sh dist/dmrdash_*_all.deb dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/dmrdash_*_all.deb
          if-no-files-found: error

  # The apt repo, on the gh-pages branch that GitHub Pages serves as https://jcalado.com/dmrdash.
  # After the release, so the repo never offers a version without one.
  apt:
    needs: release
    runs-on: ubuntu-24.04
    concurrency: gh-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist
      - name: Check out gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages && git worktree add site FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages site
          fi
      - name: Add the package and sign the repo
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get install -y -qq apt-utils >/dev/null
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          # the key that signs must be the one the package ships
          [ "$(gpg --with-colons --show-keys packaging/dmrdash-archive-keyring.gpg | awk -F: '$1=="fpr"{print $10; exit}')" = \
            "$(gpg --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')" ] || { echo "APT_SIGNING_KEY doesn't match the packaged keyring"; exit 1; }
          packaging/apt-repo.sh site dist/dmrdash_*_all.deb
      - name: Publish
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "dmrdash $GITHUB_REF_NAME"
          git push origin HEAD:gh-pages
