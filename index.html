:root {
  --panel: #1d2023; --panel-2: #24282c; --panel-3: #2c3136; --rule: #3a4046; --rule-2: #4a5158; --row: #2f3439;
  --legend: #b3bac2; --legend-dim: #8d959e; --white: #eef1f3;
  --lcd: #e4e0cc; --lcd-ink: #17190f; --lcd-dim: #5c5946; --lcd-rule: #bdb79c; --lcd-tx: #f0d9d2; --lcd-tx-ink: #a3191f;
  --tx: #e5484d; --rx: #35b46a; --busy: #f0a020; --off: #464c52;
  --tx-text: #ff9b9e; --rx-text: #8fe0b0; --fail-text: #ff8a8d; --alarm-bg: #3a1e20; --alarm-text: #ffd2d3;
  --mine: #2b2422; --danger-bg: #4a2326;
  --readout: "Callsign", ui-monospace, "SF Mono", monospace;
  --timer: "VFO Timer", ui-monospace, monospace;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--panel); color-scheme: dark; }
body { margin: 0; color: var(--white); font: 14px/1.4 var(--sans); }
::selection { background: var(--legend); color: var(--panel); }
:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
* { scrollbar-color: var(--rule-2) var(--panel); }
[hidden] { display: none !important; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 40px; }

/* engraved legends */
.lg { font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--legend); }
.lg.dim { color: var(--legend-dim); }
h2.lg { margin: 0; }

/* status strip */
/* the strip spans the whole window on desktop; the content below stays in the centred column */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding: 14px 24px; border-bottom: 1px solid var(--rule); }
.station { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.station b { font: 700 18px/1 var(--mono); letter-spacing: .04em; }
.station span { font: 13px/1 var(--mono); color: var(--legend-dim); }
.leds { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.led { display: inline-flex; align-items: center; gap: 7px; }
.led i, .state i { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.led.on i { background: var(--rx); } .led.warn i { background: var(--busy); } .led.fail i { background: var(--tx); }
.led.fail .lg { color: var(--fail-text); }
.clock { font: 600 13px/1 var(--mono); color: var(--legend); font-variant-numeric: tabular-nums; white-space: pre; }

.alarm { display: flex; align-items: flex-start; gap: 12px; margin-top: 14px; padding: 10px 14px; border: 1px solid var(--tx);
  border-radius: 6px; background: var(--alarm-bg); color: var(--alarm-text); }
.alarm b { color: #fff; }
.alarm svg { margin-top: 2px; }

/* VFO pair */
.vfos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
#vfo1, #vfo2 { min-width: 0; display: grid; }
.vfo { background: var(--panel-2); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; min-width: 0; }
.vfo-head { display: flex; align-items: center; gap: 10px; margin: 0 2px 10px; min-height: 30px; }
.ab { font: 700 12px/1 var(--mono); color: var(--panel); background: var(--legend); border-radius: 3px; padding: 3px 5px; }
.state { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; }
.state i { width: 10px; height: 10px; }
.state.rx i { background: var(--rx); } .state.tx i { background: var(--tx); }
.state.rx .lg { color: var(--rx-text); } .state.tx .lg { color: var(--tx-text); }

/* LCD, "talkgroup first": two readouts (who, then which TG), the person's details on one quiet line */
.lcd { position: relative; background: var(--lcd); color: var(--lcd-ink); border: 1px solid #0f1112; border-radius: 6px;
  padding: 14px 16px 12px; min-height: 168px; display: grid; grid-template-rows: auto auto 1fr auto; min-width: 0; }
.lcd .top { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
.lcd .call { font: 800 68px/.95 var(--readout); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcd .side { display: grid; justify-items: end; gap: 7px; flex: none; }
.lcd .timer { font: 700 26px/1 var(--timer); font-variant-numeric: tabular-nums; }
.lcd .via { font: 700 11px/1 var(--mono); letter-spacing: .1em; border: 1.5px solid currentColor; border-radius: 3px; padding: 3px 5px; }
.lcd .tg { margin-top: 14px; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.lcd .tg .num { font: 800 32px/1 var(--readout); flex: none; }
.lcd .tg .tgn { font: 600 16px/1.2 var(--sans); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcd .tg .k { font: 700 10.5px/1 var(--sans); letter-spacing: .14em; color: var(--lcd-dim); flex: none; }
.lcd .tg.msg { font: 600 15px/1.25 var(--sans); }
.lcd .meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--lcd-rule);
  font: 13px/1.3 var(--sans); color: var(--lcd-dim); min-width: 0; align-self: end; }
.lcd .meta .op { font-weight: 600; font-size: 14px; color: var(--lcd-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.lcd .meta .id { font: 13px/1.3 var(--mono); }
.lcd .meta .subs { display: inline-flex; gap: 12px; font: 13px/1.3 var(--mono); }
/* inline, not flex, so the counts share the meta row's text baseline; the icon centres on the digits' cap height */
.lcd .meta .subs svg.ic { width: 13px; height: 13px; vertical-align: calc(.5cap - .5em); margin-right: 4px; }
.lcd .meta .alias { font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.lcd.idle .call { color: var(--lcd-dim); font-size: 40px; padding-top: 6px; }
.lcd.idle .call.none { color: var(--lcd-rule); letter-spacing: .12em; }
.lcd.idle .via { color: var(--lcd-dim); }
.lcd.idle .tg, .lcd.idle .meta .op { color: var(--lcd-dim); }
.lcd.idle .tg .num { font-size: 24px; }
.lcd.tx { background: var(--lcd-tx); }
.lcd.tx .via { color: var(--lcd-tx-ink); }

/* talkgroups: summary at rest, editor on demand */
.mem { margin-top: 12px; }
.mem:empty { display: none; }
.pr .n, .er .n { font: 700 13px/1 var(--mono); }
.vfo-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; min-height: 30px; }
.vfo-foot .slotmsg { margin: 0 2px; flex: 1; min-width: 0; }
.more { position: relative; margin-left: auto; flex: none; }
.more-btn { width: 34px; padding: 0; justify-content: center; }
.more-btn[aria-expanded="true"] { border-color: var(--legend); background: var(--panel); }
.more-btn svg.ic { fill: currentColor; stroke: none; width: 16px; height: 16px; }
.pop { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 10; width: max-content; min-width: 260px; max-width: min(380px, calc(100vw - 56px));
  background: var(--panel); border: 1px solid var(--legend-dim); border-radius: 8px; padding: 10px; box-shadow: 0 10px 28px rgba(0, 0, 0, .5); }
.pop h3 { margin: 0 4px 4px; }
.pop ul { list-style: none; margin: 0; padding: 0; }
.pr { display: grid; grid-template-columns: 7ch minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 34px; padding: 0 4px; }
.pr + .pr { border-top: 1px solid var(--row); }
.pr .nm { color: var(--legend); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr .meta { font: 12px/1 var(--mono); color: var(--legend-dim); white-space: nowrap; }
.pr .meta svg.ic, .er .meta svg.ic { width: 13px; height: 13px; vertical-align: calc(.5cap - .5em); }
.pr .meta svg.ic:not(:last-child), .er .meta svg.ic:not(:last-child) { margin-right: 6px; }
.pr.q .n { color: var(--legend); }
.pr.live .n, .pr.live .nm { color: var(--rx-text); }
.pop .none { margin: 6px 4px; color: var(--legend-dim); font-size: 13px; }
.pop .edit-btn { width: 100%; justify-content: center; margin-top: 8px; }
/* presets (header) */
.presets, .info { margin-left: 0; }
.info-pop { width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 110px); overflow-y: auto; }
.info-pop h3 + dl, .info-pop h3 + .ev { margin-top: 4px; }
.info-pop dl, .info-pop .ev { padding: 0 4px 10px; }
.info-pop .ev { margin-bottom: -6px; }
.evhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.evhead .link { border: 0; background: none; padding: 2px 0; font: 600 12.5px/1 var(--sans); color: var(--legend); cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
.evhead .link:hover:not(:disabled) { color: var(--white); text-decoration-color: var(--legend); }
.evhead .link:disabled { opacity: .45; cursor: default; text-decoration: none; }
/* live log: a RAM-only tail of the DMRHost journal */
.livelog { padding-bottom: 0; overflow: hidden; }
.livelog .logbar { gap: 6px 12px; }
.disclose { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 0; cursor: pointer; color: var(--legend); }
.disclose h2 { margin: 0; }
.disclose .chev { width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s ease-out; }
.disclose[aria-expanded="false"] .chev { transform: rotate(-45deg); }
.disclose:hover { color: var(--white); }
#logjump { margin-left: auto; }
.console { height: 300px; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--rule); padding: 8px 14px;
  font: 12px/1.55 var(--mono); color: var(--legend); white-space: pre-wrap; overflow-wrap: anywhere; overscroll-behavior: contain; }
.console[hidden] { display: none; height: 0; padding-block: 0; border-top-width: 0; }
/* .anim is added on the first click, so the restored state never animates on load */
.console.anim { transition: height .2s ease-out, padding-block .2s ease-out, border-top-width .2s ease-out, display .2s allow-discrete; }
@starting-style { .console.anim:not([hidden]) { height: 0; padding-block: 0; border-top-width: 0; } }
.console:focus-visible { outline: 2px solid var(--white); outline-offset: -2px; }
.console .ln { display: grid; grid-template-columns: max-content 1.5ch minmax(0, 1fr); gap: 10px; }
.console .t { color: var(--legend-dim); }
.console .lv { color: var(--legend-dim); }
.console .W, .console .W + span { color: var(--busy); }

      h("td", { class: "r " + (c.ber == null ? "" : c.ber >= 5 ? "berb" : c.ber >= 2 ? "berw" : "") }, c.ber != null ? c.ber.toFixed(1) + "%" : ""),
      h("td", { class: "r hide-s" }, c.loss != null ? c.loss + "%" : ""));
  });
  fill($("log"), rows);
  renderChips(matched.length);
  const cut = matched.length - rows.length;
  $("morerows").hidden = cut <= 0;
  if (cut > 0) fill($("morerows"), h("span", {}, rows.length + " of " + matched.length + " shown"), h("button", { type: "button", id: "showall", onclick: () => setRows(50) }, "Show all"));
  const filtered = ui.filter.call || ui.filter.tg || (ui.hideK && S.lastheard.length);
  $("logempty").hidden = matched.length > 0;
  $("logempty").textContent = filtered ? "No calls in the log match this filter." : "No calls since DMRHost started. Calls appear here as they finish.";
}

function renderStation() {
  const d = S.bm.device || {};
  const rows = [
    ["Link", d.statusText ? d.statusText + (d.lastKnownMaster ? " · master " + d.lastKnownMaster : "") : (S.bm.error ? "BrandMeister API unreachable" : "…")],
    ["RX / TX", d.rx ? (d.rx + " / " + d.tx + " MHz").replace(/\.0000/g, ".000") : "—"],
    ["Colour code", d.colorcode != null ? d.colorcode : "—"],
    ["Modem", S.modem.description ? S.modem.description.replace(/^MMDVM_HS_Dual_Hat-v/, "MMDVM_HS dual hat · fw ").replace(/ 20\d{6}.*$/, "") : "—"],
    ["DMRHost", (S.host.version || "").replace(/^DMRHost-/, "").replace(/-DMRHost$/, "") + (S.host.since ? " · up " + ago(S.host.since) : "")],
    ["Address", (S.hostname || "") + (S.ip ? " · " + S.ip : "")],
    ["Last seen", d.last_seen ? new Date(d.last_seen.replace(" ", "T") + "Z").toLocaleTimeString([], { hourCycle: "h23" }) + " by BM" : "—"],
  ];
  const numeric = new Set(["RX / TX", "Colour code", "Address", "Last seen"]);
  fill($("station"), rows.map(([k, v]) => [h("dt", {}, k), h("dd", { class: numeric.has(k) ? "num" : null }, String(v))]));
}

// Retry storms (one or two messages repeating every few seconds) collapse to one line each: an identical
// message within 2 minutes of the same group's oldest copy joins it, so chronology outside a burst is kept.
function collapseEvents(list) {
  const groups = [], open = new Map();
  for (const e of list) {  // newest first
    const key = e.level + "|" + e.text, g = open.get(key);
    if (g && g.first - e.ts <= 120) { g.n++; g.first = e.ts; continue; }
    const ng = { ...e, n: 1, first: e.ts };
    open.set(key, ng); groups.push(ng);
  }
  return groups;
}

function renderEvents() {
  const ev = S.events.slice();
  if (S.bm.error) ev.unshift({ ts: S.bm.updated || now(), level: "W", text: S.bm.error });
  const shown = collapseEvents(ev).slice(0, 10);
  fill($("events"), shown.length ? shown.map((e) => h("li", {}, h("time", {}, hhmmss(e.ts)),
      h("span", { class: e.level }, e.text, e.n > 1 ? h("span", { class: "rep", title: e.n + " times from " + hhmmss(e.first) + " to " + hhmmss(e.ts) }, " ×" + e.n + " since " + hhmmss(e.first)) : null)))
    : h("li", {}, "Nothing to report."));
  $("evclear").disabled = !S.events.length || !!ui.busy;
  // an amber dot on the (i) key flags warnings that arrived since the popover was last opened
  if (ui.menu[3]) ui.seenEv = Math.max(ui.seenEv, ...ev.map((e) => e.ts), 0);
  $("evdot").hidden = !ev.some((e) => "WEF".includes(e.level) && e.ts > ui.seenEv);
}

/* Station details and events live behind the (i) key in the strip. */
function syncInfo() {
  $("pop3").hidden = !ui.menu[3];
  $("ibtn").setAttribute("aria-expanded", String(ui.menu[3]));
}

/* ---------------- presets: snapshots of both slots' static TGs ---------------- */
const tgList = (tgs) => tgs.length ? tgs.join(" ") : "none";
const presetSummary = (p) => "TS1 " + tgList(p.slots["1"] || []) + " · TS2 " + tgList(p.slots["2"] || []) + (p.drop_dynamic ? " · drops dynamics" : "");
function presetInUse(p) {
  const same = (n) => { const a = subsFor(n).st.map((t) => Number(t.talkgroup)).sort((x, y) => x - y), b = (p.slots[String(n)] || []).slice().sort((x, y) => x - y);
    return a.length === b.length && a.every((v, i) => v === b[i]); };
  return same(1) && same(2);
}

async function post(body) {
  const r = await fetch("/api/bm", { method: "POST", headers: { "Content-Type": "application/json", "X-Dmrdash": "1" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, j };
}

async function presetRun(body, onDone) {
  if (ui.busy) return;
  ui.busy = body.action; ui.menu[0] = false; ui.msg[0] = { text: "Working…" }; render(true);
  try {
    const { ok, status, j } = await post(body);
    if (!ok) say(0, j.error || "Failed (HTTP " + status + ")", true); else onDone(j);
  } catch (e) { say(0, "Can't reach the dashboard on the Pi", true); }
  ui.busy = null;
  await poll(); render(true);
}

function changeText(j) {
  const part = (list, sign) => [1, 2].map((s) => { const t = list.filter((x) => x[0] === s).map((x) => x[1]); return t.length ? sign + t.join(" " + sign) + " on TS" + s : null; }).filter(Boolean);
  const parts = [...part(j.added || [], "+"), ...part(j.removed || [], "−")];
  return parts.length ? parts.join(", ") : "no talkgroup changes";
}

function applyPreset(p) {
  presetRun({ action: "presetApply", name: p.name }, (j) => {
    const prev = j.previous;
    const undo = () => { ui.msg[0] = null; presetRun({ action: "presetApply", slots: prev }, (u) => say(0, "Restored your previous talkgroups (" + changeText(u) + ")", !!(u.failed || []).length)); };
    if ((j.failed || []).length) say(0, p.name + " only partly applied: " + j.failed[0] + (j.failed.length > 1 ? " (+" + (j.failed.length - 1) + " more)" : ""), true, undo);
    else say(0, "Applied " + p.name + ": " + changeText(j) + (p.drop_dynamic ? ", dynamics dropped" : ""), false, (j.added.length || j.removed.length) ? undo : null);
  });
}

function presetPanel() {
  const open = ui.menu[0], list = S.presets || [];
  if (!S.can_manage) return [];
  const saveForm = () => {
    const name = h("input", { id: "pname", type: "text", maxlength: "32", placeholder: "Preset name, e.g. Net night", "aria-label": "Preset name", autocomplete: "off",
      oninput: (e) => { ui.pdraft = e.target.value; } });
    name.value = ui.pdraft;
    const drop = h("input", { id: "pdrop", type: "checkbox", checked: ui.pdrop, onchange: (e) => { ui.pdrop = e.target.checked; } });
    return h("form", { class: "psave", novalidate: true, onsubmit: (e) => {
        e.preventDefault();
        if (!name.value.trim()) { name.focus(); return; }
        const nm = name.value.trim();
        presetRun({ action: "presetSave", name: nm, drop_dynamic: ui.pdrop }, (j) => { ui.psave = false; ui.pdraft = ""; ui.pdrop = false; say(0, "Saved preset " + nm + ": " + presetSummary(j.preset)); });
      } },
      h("p", { class: "phint" }, "Saves both slots' static talkgroups as they are now."), name,
      h("label", { class: "pchk" }, drop, "Also drop dynamic TGs when applied"),
      h("div", { class: "prow-btns" }, h("button", { class: "key sm", type: "submit", disabled: !!ui.busy }, "Save"),
        h("button", { class: "key sm", type: "button", onclick: () => { ui.psave = false; render(true); focusId("pbtn"); } }, "Cancel")));
  };
  const rows = list.map((p, i) => {
    const delId = "pdel" + i, confirming = ui.confirm === delId, used = presetInUse(p);
    return h("li", { class: "prow" + (used ? " used" : "") },
      h("button", { class: "papply", id: "papply" + i, disabled: !!ui.busy || used, title: used ? "Your talkgroups already match this preset" : "Apply " + p.name,
        onclick: () => applyPreset(p) },
        h("span", { class: "pn" }, p.name, used ? h("span", { class: "tag" }, "In use") : null), h("span", { class: "ps" }, presetSummary(p))),
      h("button", { class: "pdel" + (confirming ? " confirm" : ""), id: delId, disabled: !!ui.busy, "aria-label": confirming ? "Confirm delete " + p.name : "Delete preset " + p.name,
        onclick: () => {
          if (!confirming) { ui.confirm = delId; render(true); setTimeout(() => { if (ui.confirm === delId) { ui.confirm = null; render(true); } }, 4000); return; }
          ui.confirm = null; presetRun({ action: "presetDelete", name: p.name }, () => say(0, "Deleted preset " + p.name));
        } }, confirming ? "Delete?" : icon("x")));
  });
  return [
    h("button", { class: "key sm", id: "pbtn", "aria-expanded": open ? "true" : "false", "aria-controls": "pop0", onclick: () => { ui.menu[0] = !open; render(true); } },
      icon("preset"), "Presets"),
    open ? h("div", { class: "pop down", id: "pop0" },
      h("h3", { class: "lg" }, "Talkgroup presets"),
      rows.length ? h("ul", {}, rows) : h("p", { class: "none" }, "No presets yet. Set up your talkgroups, then save them here."),
      ui.psave ? saveForm() : h("button", { class: "key sm edit-btn", id: "psavebtn", disabled: !!ui.busy,
        onclick: () => { ui.psave = true; render(true); focusId("pname"); } }, icon("plus"), "Save current as preset…")) : null,
  ];
}

function renderGlobal(force) {
  if (force || !ui.menu[0]) fill($("presets"), presetPanel());
  const msg = ui.msg[0], m = $("gmsg");
  m.className = "slotmsg gmsg" + (msg && msg.err ? " err" : "");
  m.hidden = !msg;
  fill(m, msg ? [msg.text, msg.undo ? h("button", { id: "undo0", onclick: msg.undo }, "Undo") : null] : []);
}

/* ---------------- log filter ---------------- */
function setFilter(k, v) {
  ui.filter[k] = ui.filter[k] === v ? null : v;
  renderLog(true);
}
function filterKey(k, v, label) {
  return h("button", { class: "flt", type: "button", "aria-label": "Show only " + label, title: "Show only " + label, onclick: () => setFilter(k, v) }, icon("funnel"));
}
function renderChips(shown) {
  const f = ui.filter, chips = [];
  if (f.call) chips.push(h("button", { class: "chip", id: "chipcall", "aria-label": "Clear callsign filter " + f.call, onclick: () => setFilter("call", f.call) }, f.call, icon("x")));
  if (f.tg) chips.push(h("button", { class: "chip", id: "chiptg", "aria-label": "Clear talkgroup filter " + f.tg, onclick: () => setFilter("tg", f.tg) },
    "TG " + f.tg + (tgName(f.tg) ? " " + tgName(f.tg) : ""), icon("x")));
  if (chips.length || (ui.hideK && shown < S.lastheard.length)) chips.push(h("span", { class: "count" }, shown + " of " + S.lastheard.length));
  fill($("chips"), chips);
}
const touchOnly = matchMedia("(hover: none)");

/* ---------------- render loop ---------------- */
function render(force) {
  if (!S) return;
  const focused = document.activeElement && document.activeElement.id;
  renderStrip();
  renderGlobal(force);
  for (const n of [1, 2]) renderVfo(n, force);
  renderLog(); renderStation(); renderEvents();
  if (focused && $(focused)) $(focused).focus();
}

async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (r.ok) { S = await r.json(); skew = S.now - Date.now() / 1000; lastOk = now(); everOk = true; }
  } catch (e) { /* surfaced as the offline alarm */ }
  render();
  pollLog();
}

/* ---------------- live log ---------------- */
const LOGMAX = 400;
const L = { last: 0, open: true, follow: true, busy: false };
const msTime = (ts) => hhmmss(ts) + "." + String(Math.floor((ts % 1) * 1000)).padStart(3, "0");
async function pollLog() {
  if (!L.open || L.busy) return;
  L.busy = true;
  try {
    const r = await fetch("/api/log?after=" + L.last, { cache: "no-store" });
    if (r.ok) {
      const j = await r.json(), con = $("console");
      if (j.last < L.last) { fill(con); L.last = 0; L.busy = false; return pollLog(); }  // dashboard restarted: sequence began again
      if (L.last && j.lines.length && j.lines[0].n > L.last + 1) con.append(h("div", { class: "ln gap" }, "… older lines dropped while this view was away"));
      // appended, never re-rendered, so a text selection in the log survives updates
      con.append(...j.lines.map((x) => h("div", { class: "ln" }, h("span", { class: "t" }, msTime(x.ts)), h("span", { class: "lv " + x.l }, x.l), h("span", {}, x.t))));
      while (con.childElementCount > LOGMAX) con.firstElementChild.remove();
      L.last = j.last;
      if (L.follow) con.scrollTop = con.scrollHeight;
    }
  } catch (e) { /* the offline alarm covers this */ }
  L.busy = false;
}
function setLogOpen(open) {
  L.open = open;
  $("logtoggle").setAttribute("aria-expanded", String(open));
  $("console").hidden = !open;
  if (!open) $("logjump").hidden = true;
  try { localStorage.setItem("dmrdash.logOpen", open ? "1" : "0"); } catch (e) {}
  if (open) { L.follow = true; pollLog(); }
}

function say(n, text, err, undo) {
  ui.msg[n] = { text, err, undo };
  const stamp = ui.msg[n];
  // successes fade; errors stay until the next action on this slot
  if (!err) setTimeout(() => { if (ui.msg[n] === stamp) { ui.msg[n] = null; render(true); } }, undo ? 10000 : 6000);
}

async function act(body, n, okText, undo) {
  if (ui.busy) return false;
  ui.busy = body.action + n + (body.talkgroup ? "/" + body.talkgroup : "");
  ui.msg[n] = { text: "Working…" }; render(true);
  let ok = false;
  try {
    const r = await fetch("/api/bm", { method: "POST", headers: { "Content-Type": "application/json", "X-Dmrdash": "1" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    ok = r.ok;
    say(n, ok ? okText : (j.error || "Failed (HTTP " + r.status + ")"), !ok, ok ? undo : null);
  } catch (e) { say(n, "Can't reach the dashboard on the Pi", true); }
  ui.busy = null;
  await poll();
  render(true);
  return ok;
}

async function addTG(n, tg) {
  const ok = await act({ action: "add", slot: n, talkgroup: tg }, n, "Added TG " + tg + (tgName(tg) ? " " + tgName(tg) : "") + " to TS" + n);
  if (ok) { ui.draft[n] = ""; render(true); focusId("add" + n); }
}
function removeTG(n, tg) {
  act({ action: "remove", slot: n, talkgroup: tg }, n, "Removed TG " + tg + " from TS" + n,
    () => { ui.msg[n] = null; act({ action: "add", slot: n, talkgroup: tg }, n, "Restored TG " + tg + " on TS" + n); });
}

setInterval(() => {
  for (const t of document.querySelectorAll(".timer[data-start]")) t.textContent = clockDur(Math.max(0, now() - Number(t.dataset.start)));
  const d = new Date(Date.now() + skew * 1000);
  $("clock").textContent = d.toLocaleTimeString([], { hourCycle: "h23" }) + "  ·  " + d.toISOString().slice(11, 16) + "Z";
}, 250);
initLogHead(); renderLogHead();
// how many Last heard rows to draw: 5, 10 or 50 (all the Pi keeps), remembered per browser
function setRows(n) {
  ui.rows = [5, 10, 50].includes(n) ? n : 50;
  for (const b of $("rowsel").querySelectorAll("button")) {
    const on = Number(b.dataset.rows) === ui.rows;
    b.setAttribute("aria-checked", String(on)); b.tabIndex = on ? 0 : -1;
  }
  try { localStorage.setItem("dmrdash.rows", String(ui.rows)); } catch (e) {}
  if (S) renderLog(true);
}
try { setRows(Number(localStorage.getItem("dmrdash.rows")) || 50); } catch (e) { setRows(50); }
$("rowsel").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setRows(Number(b.dataset.rows)); });
$("rowsel").addEventListener("keydown", (e) => {  // radio-group arrows
  const order = [5, 10, 50], i = order.indexOf(ui.rows), d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (!d) return;
  e.preventDefault(); setRows(order[(i + d + order.length) % order.length]);
  $("rowsel").querySelector('[aria-checked="true"]').focus();
});
$("logtoggle").addEventListener("click", () => { $("console").classList.add("anim"); setLogOpen(!L.open); });
$("console").addEventListener("scroll", (e) => {
  const c = e.target;
  L.follow = c.scrollHeight - c.scrollTop - c.clientHeight < 24;  // scrolled up to read: stop following until back at the bottom
  $("logjump").hidden = L.follow;
});
$("logjump").addEventListener("click", () => { const c = $("console"); L.follow = true; c.scrollTop = c.scrollHeight; $("logjump").hidden = true; });
try { if (localStorage.getItem("dmrdash.logOpen") === "0") setLogOpen(false); } catch (e) {}
ui.menu[3] = false; ui.seenEv = 0;
$("ibtn").prepend(icon("info"));
$("ibtn").addEventListener("click", () => { ui.menu[3] = !ui.menu[3]; syncInfo(); if (S) renderEvents(); });
$("evclear").addEventListener("click", async () => {
  if (ui.busy) return;
  ui.busy = "clearEvents"; $("evclear").disabled = true;
  try { const { ok, j } = await post({ action: "clearEvents" }); if (!ok) say(0, j.error || "Couldn't clear events", true); }
  catch (e) { say(0, "Can't reach the dashboard on the Pi", true); }
  ui.busy = null; await poll(); render(true); focusId("ibtn");
});
// "Hide kerchunks" is a per-viewer preference, so it lives in this browser's storage
// the cutoff is adjustable like WPSD's: 0.5 s steps from 0.5 to 10 s, default 1 s
const kClamp = (v) => Math.min(10, Math.max(0.5, Math.round(v * 2) / 2));
try { ui.hideK = localStorage.getItem("dmrdash.hideK") === "1"; } catch (e) { ui.hideK = false; }
try { const v = parseFloat(localStorage.getItem("dmrdash.kMax")); ui.kMax = Number.isFinite(v) ? kClamp(v) : 1; } catch (e) { ui.kMax = 1; }
function syncKerchunk() {
  $("hidek").setAttribute("aria-checked", String(ui.hideK));
  $("hidek").title = "Hide transmissions shorter than " + ui.kMax + " s";
  $("ksecs").hidden = !ui.hideK;
  if (document.activeElement !== $("kmax")) $("kmax").value = ui.kMax;
}
syncKerchunk();
$("hidek").addEventListener("click", () => {
  ui.hideK = !ui.hideK;
  syncKerchunk();
  try { localStorage.setItem("dmrdash.hideK", ui.hideK ? "1" : "0"); } catch (e) {}
  if (S) renderLog(true);
});
$("kmax").addEventListener("input", (e) => {
  const v = parseFloat(e.target.value);
  if (!Number.isFinite(v)) return;  // mid-edit (empty field): keep the last good cutoff
  ui.kMax = kClamp(v);
  try { localStorage.setItem("dmrdash.kMax", String(ui.kMax)); } catch (e) {}
  syncKerchunk();
  if (S) renderLog(true);
});
// colour rows by: off, caller, talkgroup or timeslot; remembered per browser
const COL_MODES = ["", "call", "tg", "ts"];
function setColBy(m) {
  ui.colBy = COL_MODES.includes(m) ? m : "";
  for (const b of $("colsel").querySelectorAll("button")) {
    const on = b.dataset.col === ui.colBy;
    b.setAttribute("aria-checked", String(on)); b.tabIndex = on ? 0 : -1;
  }
  try { localStorage.setItem("dmrdash.colBy", ui.colBy); } catch (e) {}
  if (S) renderLog(true);
}
try {
  let m = localStorage.getItem("dmrdash.colBy");
  if (m === null && localStorage.getItem("dmrdash.colCall") === "1") m = "call";  // the earlier on/off switch
  setColBy(m || "");
} catch (e) { setColBy(""); }
$("colsel").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setColBy(b.dataset.col); });
$("colsel").addEventListener("keydown", (e) => {
  const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (!d) return;
  e.preventDefault();
  setColBy(COL_MODES[(COL_MODES.indexOf(ui.colBy) + d + COL_MODES.length) % COL_MODES.length]);
  $("colsel").querySelector('[aria-checked="true"]').focus();
});
$("kmax").addEventListener("blur", (e) => { e.target.value = ui.kMax; syncKerchunk(); });
$("log").addEventListener("pointerdown", () => { logHold = true; });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) $("log").addEventListener(ev, () => setTimeout(() => { logHold = false; }, 400));
poll(); setInterval(poll, 2000);
</script>
