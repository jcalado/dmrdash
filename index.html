:root {
  --panel: #1d2023; --panel-2: #24282c; --panel-3: #2c3136; --rule: #3a4046; --rule-2: #4a5158; --row: #2f3439;
  --legend: #b3bac2; --legend-dim: #8d959e; --white: #eef1f3;
  --lcd: #e4e0cc; --lcd-ink: #17190f; --lcd-dim: #5c5946; --lcd-rule: #bdb79c; --lcd-tx: #f0d9d2; --lcd-tx-ink: #a3191f;
  --tx: #e5484d; --rx: #35b46a; --busy: #f0a020; --off: #464c52;
  --tx-text: #ff9b9e; --rx-text: #8fe0b0; --fail-text: #ff8a8d; --alarm-bg: #3a1e20; --alarm-text: #ffd2d3;
  --mine: #2b2422; --danger-bg: #4a2326;
  --readout: "Callsign", ui-monospace, "SF Mono", monospace;
  --timer: "VFO Timer", ui-monospace, monospace;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--panel); color-scheme: dark; }
body { margin: 0; color: var(--white); font: 14px/1.4 var(--sans); }
::selection { background: var(--legend); color: var(--panel); }
:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
* { scrollbar-color: var(--rule-2) var(--panel); }
[hidden] { display: none !important; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 40px; }

/* engraved legends */
.lg { font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--legend); }
.lg.dim { color: var(--legend-dim); }
h2.lg { margin: 0; }

/* status strip */
/* the strip spans the whole window on desktop; the content below stays in the centred column */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding: 14px 24px; border-bottom: 1px solid var(--rule); }
.station { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.station b { font: 700 18px/1 var(--mono); letter-spacing: .04em; }
.station span { font: 13px/1 var(--mono); color: var(--legend-dim); }
.leds { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.led { display: inline-flex; align-items: center; gap: 7px; }
.led i, .state i { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.led.on i { background: var(--rx); } .led.warn i { background: var(--busy); } .led.fail i { background: var(--tx); }
.led.fail .lg { color: var(--fail-text); }
.clock { font: 600 13px/1 var(--mono); color: var(--legend); font-variant-numeric: tabular-nums; white-space: pre; }

.alarm { display: flex; align-items: flex-start; gap: 12px; margin-top: 14px; padding: 10px 14px; border: 1px solid var(--tx);
  border-radius: 6px; background: var(--alarm-bg); color: var(--alarm-text); }
.alarm b { color: #fff; }
.alarm svg { margin-top: 2px; }

/* VFO pair */
.vfos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
#vfo1, #vfo2 { min-width: 0; display: grid; }
.vfo { background: var(--panel-2); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; min-width: 0; }
.vfo-head { display: flex; align-items: center; gap: 10px; margin: 0 2px 10px; min-height: 30px; }
.ab { font: 700 12px/1 var(--mono); color: var(--panel); background: var(--legend); border-radius: 3px; padding: 3px 5px; }
.state { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; }
.state i { width: 10px; height: 10px; }
.state.rx i { background: var(--rx); } .state.tx i { background: var(--tx); }
.state.rx .lg { color: var(--rx-text); } .state.tx .lg { color: var(--tx-text); }

/* LCD, "talkgroup first": two readouts (who, then which TG), the person's details on one quiet line */
.lcd { position: relative; background: var(--lcd); color: var(--lcd-ink); border: 1px solid #0f1112; border-radius: 6px;
  padding: 14px 16px 12px; min-height: 168px; display: grid; grid-template-rows: auto auto 1fr auto; min-width: 0; }
.lcd .top { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
.lcd .call { font: 800 68px/.95 var(--readout); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcd .side { display: grid; justify-items: end; gap: 7px; flex: none; }
.lcd .timer { font: 700 26px/1 var(--timer); font-variant-numeric: tabular-nums; }
.lcd .via { font: 700 11px/1 var(--mono); letter-spacing: .1em; border: 1.5px solid currentColor; border-radius: 3px; padding: 3px 5px; }
.lcd .tg { margin-top: 14px; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.lcd .tg .num { font: 800 32px/1 var(--readout); flex: none; }
.lcd .tg .tgn { font: 600 16px/1.2 var(--sans); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcd .tg .k { font: 700 10.5px/1 var(--sans); letter-spacing: .14em; color: var(--lcd-dim); flex: none; }
.lcd .tg.msg { font: 600 15px/1.25 var(--sans); }
.lcd .meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--lcd-rule);
  font: 13px/1.3 var(--sans); color: var(--lcd-dim); min-width: 0; align-self: end; }
.lcd .meta .op { font-weight: 600; font-size: 14px; color: var(--lcd-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.lcd .meta .id { font: 13px/1.3 var(--mono); }
.lcd .meta .subs { display: inline-flex; gap: 12px; font: 13px/1.3 var(--mono); }
/* inline, not flex, so the counts share the meta row's text baseline; the icon centres on the digits' cap height */
.lcd .meta .subs svg.ic { width: 13px; height: 13px; vertical-align: calc(.5cap - .5em); margin-right: 4px; }
.lcd .meta .alias { font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.lcd.idle .call { color: var(--lcd-dim); font-size: 40px; padding-top: 6px; }
.lcd.idle .call.none { color: var(--lcd-rule); letter-spacing: .12em; }
.lcd.idle .via { color: var(--lcd-dim); }
.lcd.idle .tg, .lcd.idle .meta .op { color: var(--lcd-dim); }
.lcd.idle .tg .num { font-size: 24px; }
.lcd.tx { background: var(--lcd-tx); }
.lcd.tx .via { color: var(--lcd-tx-ink); }

/* talkgroups: summary at rest, editor on demand */
.mem { margin-top: 12px; }
.mem:empty { display: none; }
.pr .n, .er .n { font: 700 13px/1 var(--mono); }
.vfo-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; min-height: 30px; }
.vfo-foot .slotmsg { margin: 0 2px; flex: 1; min-width: 0; }
.more { position: relative; margin-left: auto; flex: none; }
.more-btn { width: 34px; padding: 0; justify-content: center; }
.more-btn[aria-expanded="true"] { border-color: var(--legend); background: var(--panel); }
.more-btn svg.ic { fill: currentColor; stroke: none; width: 16px; height: 16px; }
.pop { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 10; width: max-content; min-width: 260px; max-width: min(380px, calc(100vw - 56px));
  background: var(--panel); border: 1px solid var(--legend-dim); border-radius: 8px; padding: 10px; box-shadow: 0 10px 28px rgba(0, 0, 0, .5); }
.pop h3 { margin: 0 4px 4px; }
.pop ul { list-style: none; margin: 0; padding: 0; }
.pr { display: grid; grid-template-columns: 7ch minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 34px; padding: 0 4px; }
.pr + .pr { border-top: 1px solid var(--row); }
.pr .nm { color: var(--legend); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr .meta { font: 12px/1 var(--mono); color: var(--legend-dim); white-space: nowrap; }
.pr .meta svg.ic, .er .meta svg.ic { width: 13px; height: 13px; vertical-align: calc(.5cap - .5em); }
.pr .meta svg.ic:not(:last-child), .er .meta svg.ic:not(:last-child) { margin-right: 6px; }
.pr.q .n { color: var(--legend); }
.pr.live .n, .pr.live .nm { color: var(--rx-text); }
.pop .none { margin: 6px 4px; color: var(--legend-dim); font-size: 13px; }
.pop .edit-btn { width: 100%; justify-content: center; margin-top: 8px; }
/* presets (header) */
.presets, .info { margin-left: 0; }
.info-pop { width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 110px); overflow-y: auto; }
.info-pop h3 + dl, .info-pop h3 + .ev { margin-top: 4px; }
.info-pop dl, .info-pop .ev { padding: 0 4px 10px; }
.info-pop .ev { margin-bottom: -6px; }
.evhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.evhead .link { border: 0; background: none; padding: 2px 0; font: 600 12.5px/1 var(--sans); color: var(--legend); cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
.evhead .link:hover:not(:disabled) { color: var(--white); text-decoration-color: var(--legend); }
.evhead .link:disabled { opacity: .45; cursor: default; text-decoration: none; }
/* restart / shut down the Pi, at the foot of the station popover */
.power { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; padding: 10px 4px 0; border-top: 1px solid var(--row); }
.power h3 { margin: 0 auto 0 0; }
.power .none { margin: 0; flex-basis: 100%; }
/* live log: a RAM-only tail of the DMRHost journal */
.livelog { padding-bottom: 0; overflow: hidden; }
.livelog .logbar { gap: 6px 12px; }
.disclose { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 0; cursor: pointer; color: var(--legend); }
.disclose h2 { margin: 0; }
.disclose .chev { width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s ease-out; }
.disclose[aria-expanded="false"] .chev { transform: rotate(-45deg); }
.disclose:hover { color: var(--white); }
#logjump { margin-left: auto; }
.console { height: 300px; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--rule); padding: 8px 14px;
  font: 12px/1.55 var(--mono); color: var(--legend); white-space: pre-wrap; overflow-wrap: anywhere; overscroll-behavior: contain; }
.console[hidden] { display: none; height: 0; padding-block: 0; border-top-width: 0; }
/* .anim is added on the first click, so the restored state never animates on load */
.console.anim { transition: height .2s ease-out, padding-block .2s ease-out, border-top-width .2s ease-out, display .2s allow-discrete; }
@starting-style { .console.anim:not([hidden]) { height: 0; padding-block: 0; border-top-width: 0; } }

<body>
  <header class="strip">
    <div class="station"><b id="call">DMRHost</b><span id="devid"></span></div>
    <div class="leds" id="leds"></div>

    <div class="more presets" id="presets" data-slot="0"></div>
    <div class="more info" id="info" data-slot="3">
      <button class="key sm more-btn" id="ibtn" type="button" aria-expanded="false" aria-controls="pop3" aria-label="Station details and events" title="Station details and events"><span class="newdot" id="evdot" hidden></span></button>
      <div class="pop down info-pop" id="pop3" hidden>
        <h3 class="lg">Station</h3><dl id="station"></dl>
        <div class="evhead"><h3 class="lg">Events</h3><button class="link" id="evclear" type="button">Clear</button></div><ul class="ev" id="events"></ul>
        <div class="power" id="power"></div>

    </div>
  </header>
<div class="wrap">
  <div class="alarm" id="alarm" role="alert" hidden></div>
  <div class="slotmsg gmsg" id="gmsg" aria-live="polite" hidden></div>

  <main class="vfos"><div id="vfo1"></div><div id="vfo2"></div></main>

  <section class="deck">
    <div class="box" data-sec="heard">
      <div class="logbar"><h2 class="lg">Last heard</h2><div class="chips" id="chips"></div>
        <div class="kfilter"><div class="seg" id="rowsel" role="radiogroup" aria-label="Rows shown"><span class="lg dim" aria-hidden="true">Rows</span><button type="button" role="radio" data-rows="5">5</button><button type="button" role="radio" data-rows="10">10</button><button type="button" role="radio" data-rows="50">50</button></div>
        <div class="seg" id="colsel" role="radiogroup" aria-label="Colour rows by"><span class="lg dim" aria-hidden="true">Colour</span><button type="button" role="radio" data-col="">Off</button><button type="button" role="radio" data-col="call" title="Each caller gets a colour">Caller</button><button type="button" role="radio" data-col="tg" title="Each talkgroup gets a colour">TG</button><button type="button" role="radio" data-col="ts" title="TS1 cyan, TS2 violet">TS</button></div>
        <button class="switch" id="hidek" type="button" role="switch" aria-checked="false"><span class="track" aria-hidden="true"><i></i></span>Hide kerchunks</button>
        <label class="ksecs" id="ksecs" hidden>&lt; <input id="kmax" type="number" min="0.5" max="10" step="0.5" inputmode="decimal" aria-label="Hide calls shorter than this many seconds"> s</label></div></div>
      <div class="tablewrap"><table>
        <thead id="loghead"><tr><th data-k="ts">Time</th><th data-k="slot">TS</th><th data-k="call">Callsign</th><th data-k="dst">Talkgroup</th><th class="hide-s" data-k="tgname">TG name</th><th class="r" data-k="duration">Dur</th><th class="r" data-k="ber">BER</th><th class="r hide-s" data-k="loss">Loss</th></tr></thead>
        <tbody id="log"></tbody>
      </table></div>
      <div class="morerows" id="morerows" hidden></div>
      <div class="empty" id="logempty" hidden>No calls since DMRHost started. Calls appear here as they finish.</div>
    </div>
    <div class="box berbox" data-sec="ber">
      <div class="logbar">
        <button class="disclose" id="bertoggle" type="button" aria-expanded="true" aria-controls="berbody"><span class="chev" aria-hidden="true"></span><h2 class="lg">RF BER</h2></button>
        <span class="lg dim">Your radio into the hotspot</span>

      </div>
      <div class="slotmsg bermsg" id="bermsg" aria-live="polite" hidden></div>
      <div class="berplot" id="berbody"><div id="berplot"></div><div class="berkey" id="berkey" aria-hidden="true"></div></div>
    </div>
    <div class="box livelog" data-sec="log">
      <div class="logbar">
        <button class="disclose" id="logtoggle" type="button" aria-expanded="true" aria-controls="console"><span class="chev" aria-hidden="true"></span><h2 class="lg">Live log</h2></button>
        <button class="key sm" id="logjump" type="button" hidden>Jump to live</button>
      </div>
      <div class="console" id="console" role="log" aria-label="DMRHost live log" tabindex="0"></div>
    </div>

  <div class="vh" id="ordermsg" aria-live="polite"></div>
</div>

  </form>
</dialog>

<script>
"use strict";
const ICONS = {
  x: '<path d="M4 4l8 8M12 4l-8 8"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',
  stop: '<rect x="4" y="4" width="8" height="8" rx="1"/>',
  drop: '<path d="M3 8h10M6 5L3 8l3 3"/>',
  edit: '<path d="M10.5 2.5l3 3L6 13H3v-3z"/>',
  preset: '<path d="M3 4h10M3 8h10M3 12h6"/><path d="M12 11l1.5 1.5L16 10"/>',
  info: '<circle cx="8" cy="8" r="6.3"/><path d="M8 7.3v4M8 4.9v.01"/>',
  funnel: '<path d="M2.5 3h11l-4.2 5v4.5l-2.6 1.3V8z"/>',
  grip: '<circle cx="5.5" cy="3.5" r="1.3"/><circle cx="10.5" cy="3.5" r="1.3"/><circle cx="5.5" cy="8" r="1.3"/><circle cx="10.5" cy="8" r="1.3"/><circle cx="5.5" cy="12.5" r="1.3"/><circle cx="10.5" cy="12.5" r="1.3"/>',
  more: '<circle cx="3.5" cy="8" r="1.1"/><circle cx="8" cy="8" r="1.1"/><circle cx="12.5" cy="8" r="1.1"/>',
  warn: '<path d="M8 2l7 12H1z"/><path d="M8 7v3M8 12v.01"/>',
  static: '<path d="M8 14V9.5"/><path d="M4 9.5h8L10.5 3h-5z"/>',
  dynamic: '<path d="M10 2L5 8h6l-5 6"/>',
  timed: '<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8h3"/>',
  power: '<path d="M8 2v6"/><path d="M4.6 4.3a5.2 5.2 0 1 0 6.8 0"/>',
  restart: '<path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5v3h-3"/>',
};
function icon(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", "ic"); s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("aria-hidden", "true");

// DOM builder: data always lands as text nodes (talker aliases come off the air).

  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
}
const fill = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false));
const $ = (id) => document.getElementById(id);

let S = null, skew = 0, lastOk = 0, everOk = false;
const ui = { draft: { 1: "", 2: "" }, editing: { 1: false, 2: false }, menu: { 1: false, 2: false }, hold: { 1: false, 2: false }, confirm: null, busy: null, msg: { 0: null, 1: null, 2: null }, filter: { call: null, tg: null }, psave: false, pdraft: "", pdrop: false };
ui.menu[0] = false;

const now = () => Date.now() / 1000 + skew;
const hhmmss = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hourCycle: "h23", hour: "2-digit", minute: "2-digit", second: "2-digit" });
function ago(ts) {
  const s = Math.max(0, now() - ts);
  if (s < 60) return Math.floor(s) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
  return Math.floor(s / 86400) + "d " + Math.floor((s % 86400) / 3600) + "h";
}
const clockDur = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const logDur = (s) => s < 60 ? s.toFixed(1) + "s" : Math.floor(s / 60) + "m" + String(Math.round(s % 60)).padStart(2, "0");
const tgName = (tg) => (S && S.tg_names && S.tg_names[String(tg)]) || "";
const myRadioId = () => S ? Math.floor(S.device_id / 100) : 0;
const callOf = (w) => (w && (w.callsign || w.id)) || "?";

/* ---------------- health ---------------- */
function health() {
  const offline = everOk && now() - lastOk > 10;
  const host = S.host.status, modem = S.modem.status, net = S.network.status;
  const leds = [
    ["DMRHost", host === "running" ? "on" : host === "starting" ? "warn" : "fail"],
    ["Modem", modem === "ok" ? "on" : modem === "opening" ? "warn" : "fail"],
    ["BM " + ((S.bm.device && S.bm.device.lastKnownMaster) || "link"),
      net === "connected" ? "on" : (net === "connecting" || net === "unknown") ? "warn" : "fail"],
  ];
  let alarm = null;
  if (offline) alarm = ["Dashboard can't reach the Pi", "Last update " + ago(lastOk) + " ago. Showing the last known state."];
  else if (host === "stopped") alarm = ["DMRHost is stopped", "The hotspot isn't running. Check it with: systemctl status dmrhost"];
  else if (modem === "error") alarm = ["Modem problem", "DMRHost reported a modem error. RF may not work; see Events below."];
  else if (["login failed", "reconnecting", "down", "master closing"].includes(net))
    alarm = ["BrandMeister link " + (net === "login failed" ? "login failed" : "lost"),
      (net === "login failed" ? "The master rejected the hotspot password. " : "Retrying the master since " + ago(S.network.since) + " ago. ")
      + "RF still works locally; nothing reaches the network."];
  if (ui.power) alarm = ui.power.what === "reboot"
    ? ["Restarting the hotspot", "Off the air for a minute or so. This page reconnects by itself."]
    : ["Shutting down the hotspot", "Once the Pi's green LED stops flashing it is safe to unplug. Plug it back in to start it again."];
  if (offline) leds.forEach((l) => { l[1] = "warn"; });
  return { leds, alarm };
}

function renderStrip() {
  const dev = S.bm.device || {};
  $("call").textContent = dev.callsign || "DMRHost";
  $("devid").textContent = S.device_id;
  document.title = (dev.callsign || "DMRHost") + " · DMRHost";
  const { leds, alarm } = health();
  fill($("leds"), leds.map(([l, c]) => h("span", { class: "led " + c, title: l + ": " + c }, h("i"), h("span", { class: "lg" }, l))));
  const al = $("alarm");
  al.hidden = !alarm;
  if (alarm) fill(al, icon("warn"), h("span", {}, h("b", {}, alarm[0]), " · ", alarm[1]));
}

/* ---------------- VFOs ---------------- */
function subsFor(slot) {
  const bm = S.bm, f = (t) => Number(t.slot) === slot;
  return { st: bm.static.filter(f), dy: bm.dynamic.filter(f), ti: bm.timed.filter(f) };
}

// The readout face is proportional, so a long or wide callsign (VK2ABCD, MW0MWW) is measured and shrunk just enough to fit beside the timer.
function fitCall(el) {
  if (!el) return;
  el.style.fontSize = "";
  for (let i = 0; i < 8 && el.scrollWidth > el.clientWidth; i++) {
    const size = parseFloat(getComputedStyle(el).fontSize);
    if (size <= 30) break;
    el.style.fontSize = Math.max(30, Math.min(size - 1, Math.floor(size * 0.98 * el.clientWidth / el.scrollWidth))) + "px";  // 2%: wide glyphs' ink overhangs their advance
  }
}
const fitCalls = () => document.querySelectorAll(".lcd .call").forEach(fitCall);
// the first render can measure fallback faces; refit once both readout faces (callsign, and the timer beside it) are in
Promise.all([document.fonts.load('800 40px "Callsign"', "A"), document.fonts.load('700 26px "VFO Timer"', "0")]).then(fitCalls);
addEventListener("resize", fitCalls);

function lcdTg(c) {
  const name = c.group ? tgName(c.dst) : pcName(c);
  return h("div", { class: "tg" }, c.group ? null : h("span", { class: "k" }, "PRIVATE"),
    h("span", { class: "num" }, c.dst), name ? h("span", { class: "tgn" }, name) : null);
}

function lcdLive(s) {
  const tx = s.source === "rf", w = s.who || { id: s.src };
  return h("div", { class: "lcd" + (tx ? " tx" : "") },
    h("div", { class: "top" }, h("div", { class: "call" }, callOf(w)),
      h("div", { class: "side" }, h("span", { class: "timer", "data-start": s.start }, clockDur(Math.max(0, now() - s.start))),
        h("span", { class: "via" }, tx ? "RF" : "NET"))),
    lcdTg(s),
    h("div"),
    h("div", { class: "meta" }, w.name ? h("span", { class: "op" }, w.name) : null, h("span", { class: "id", title: "DMR ID" }, w.id),
      s.alias ? h("span", { class: "alias" }, "“" + s.alias + "”") : null));
}

function lcdIdle(n, subs) {
  const last = S.lastheard.find((c) => c.slot === n);
  const sub = (kind, list) => { const label = list.length + " " + kind + " talkgroup" + (list.length === 1 ? "" : "s");
    return h("span", { role: "img", "aria-label": label, title: label }, icon(kind), list.length); };
  const counts = h("span", { class: "subs" }, sub("static", subs.st), sub("dynamic", subs.dy), subs.ti.length ? sub("timed", subs.ti) : null);
  return h("div", { class: "lcd idle" },
    h("div", { class: "top" },
      last ? h("div", { class: "call" }, callOf(last.who)) : h("div", { class: "call none", "aria-hidden": "true" }, "------"),
      last ? h("div", { class: "side" }, h("span", { class: "via", title: "Last caller on this slot" }, "LAST")) : null),
    last ? lcdTg(last) : h("div", { class: "tg msg" }, !everOk ? "Connecting…" : "Listening · no calls yet on this slot"),
    h("div"),
    h("div", { class: "meta" }, last && last.who && last.who.name ? h("span", { class: "op" }, last.who.name) : null,
      last ? h("span", {}, ago(last.ts) + " ago") : null, counts));
}

const DAYS = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
function schedule(t) {
  const d = t.data || {}, hm = (s) => String(Math.floor(s / 3600)).padStart(2, "0") + ":" + String(Math.floor(s % 3600 / 60)).padStart(2, "0");
  const days = DAYS.filter((k) => d[k]).map((k) => k[0].toUpperCase() + k.slice(1, 3));
  return (days.length === 7 ? "daily" : days.join(" ")) + (d.start != null && d.stop != null ? " " + hm(d.start) + "–" + hm(d.stop) : "");
}
// subscription kind as an icon, named for screen readers, followed by its detail
function subMeta(kind, label, detail) {
  const ic = icon(kind); ic.setAttribute("role", "img"); ic.setAttribute("aria-label", label); ic.removeAttribute("aria-hidden");
  return h("span", { class: "meta", title: label + (detail ? " · " + detail : "") }, ic, detail ? h("span", {}, detail) : null);

const dynLeft = (d) => { const left = d.timeout ? Math.ceil((d.timeout - now()) / 60) : null; return left == null ? "" : left > 0 ? left + "m left" : "ending"; };

/* Talkgroup list and Edit live behind an overflow key at the panel's bottom right. */
function tgMenu(n, subs) {
  const s = S.slots[n], open = ui.menu[n], live = (tg) => s.active && s.group && String(s.dst) === String(tg);

    h("span", { class: "n" }, tg), h("span", { class: "nm" }, tgName(tg)), subMeta(kind, label, detail));
  const rows = [
    ...subs.st.map((t) => row(t.talkgroup, "static", "static")),
    ...subs.dy.map((d) => row(d.talkgroup, "dynamic", "dynamic", dynLeft(d), "q")),
    ...subs.ti.map((t) => row(t.talkgroup, "timed", "timed", schedule(t), "q")),
    n === 1 && S.bm.autoStatic ? row(S.bm.autoStatic, "static", "auto-static", "auto", "q") : null,
  ].filter(Boolean);
  const count = subs.st.length + subs.dy.length + subs.ti.length;
  return [
    h("button", { class: "key sm more-btn", id: "more" + n, "aria-expanded": open ? "true" : "false", "aria-controls": "pop" + n,
      "aria-label": "Talkgroups on TS" + n + " (" + count + ")", title: "Talkgroups on TS" + n,
      onclick: () => { ui.menu[n] = !open; render(true); } }, icon("more")),
    open ? h("div", { class: "pop", id: "pop" + n },
      h("h3", { class: "lg" }, "Talkgroups · TS" + n),
      rows.length ? h("ul", {}, rows) : h("p", { class: "none" }, "No talkgroups. Key up any TG to link it dynamically."),
      S.can_manage ? h("button", { class: "key sm edit-btn", id: "edit" + n, disabled: !!ui.busy,
        onclick: () => { ui.menu[n] = false; ui.editing[n] = true; render(true); focusId("ed" + n); } }, icon("edit"), "Edit talkgroups") : null) : null,
  ];
}
function closeMenus(except) {
  // only the closing menu re-renders, so a tap landing on the other slot's key isn't lost
  for (const n of [0, 1, 2, 3, 4]) if (ui.menu[n] && n !== except) {
    ui.menu[n] = false;
    if (n === 3) syncInfo();
    else if (n === 4) { if (S) renderBer(); }

document.addEventListener("pointerdown", (e) => { const m = e.target.closest && e.target.closest(".more"); closeMenus(m ? Number(m.dataset.slot) : -1); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  for (const n of [0, 1, 2, 3, 4]) if (ui.menu[n]) { ui.menu[n] = false; if (n === 3) syncInfo(); render(true); focusId(["pbtn", "more1", "more2", "ibtn", "tbtn"][n]); }
});

/* On demand: the full list with spelled-out actions. */
function tgEditor(n, subs) {
  const busy = !!ui.busy;
  const done = () => { ui.editing[n] = false; ui.draft[n] = ""; render(true); focusId("more" + n); };
  const rows = [

/* Sort state: column key and direction (1 asc, -1 desc). Default is newest first,
   the order the server sends. Kept per viewer in localStorage when available. */
const SORT_KEYS = {
  ts: (c) => c.ts,
  slot: (c) => c.slot,
  call: (c) => String(callOf(c.who)),
  dst: (c) => Number(c.dst),

  duration: (c) => c.duration,
  ber: (c) => c.ber,
  loss: (c) => c.loss,
};
let sort = { k: "ts", d: -1 };
try { const v = JSON.parse(localStorage.getItem("dmrdash.sort")); if (v && SORT_KEYS[v.k] && (v.d === 1 || v.d === -1)) sort = v; } catch (e) {}

function setSort(k) {
  // Same column flips direction; a new column starts newest/largest first, except callsign and TG name (A-Z).
  sort = sort.k === k ? { k, d: -sort.d } : { k, d: k === "call" || k === "tgname" ? 1 : -1 };
  try { localStorage.setItem("dmrdash.sort", JSON.stringify(sort)); } catch (e) {}
  if (S) renderLog();
}

function initLogHead() {
  for (const th of document.querySelectorAll("#loghead th[data-k]")) {
    const label = th.textContent;

      th.classList.contains("r") ? h("span", { class: "ar", "aria-hidden": "true" }) : null, label,

function renderLogHead() {

    th.querySelector(".ar").textContent = on ? (sort.d === 1 ? "▲" : "▼") : "";

function sortedLog() {
  const key = SORT_KEYS[sort.k];
  // Missing values (no BER, no duration) always go last; ties fall back to newest first.
  const f = ui.filter;
  const keep = (c) => (!f.call || String(callOf(c.who)) === f.call) && (!f.tg || (c.group && String(c.dst) === f.tg))
    && !(ui.hideK && c.duration != null && c.duration < ui.kMax);  // kerchunks: keyed up for less than the cutoff (default 1 s, like WPSD)
  return S.lastheard.map((c, i) => [c, key(c), i]).filter((r) => keep(r[0])).sort((a, b) => {
    const x = a[1], y = b[1];
    if (x == null || y == null) return x == null && y == null ? a[2] - b[2] : x == null ? 1 : -1;
    const o = typeof x === "string" ? x.localeCompare(y, undefined, { sensitivity: "base", numeric: true }) : x - y;

// Row colours: 6 cyan/blue/violet/orchid tones, distinct from plain text and none near the LED red, amber or green.
// Callers and talkgroups each get one: a key starts from a hash of itself (FNV-1a); if a key already in the log
// holds that colour it takes the next free one. Assignments never change once made, so nothing shifts mid-session.
const ROW_COLOURS = ["#5fc6de", "#5a9cff", "#9a9cff", "#bb8cff", "#e58bd6", "#dcb8ff"];

function hashIdx(key) {
  let x = 0x811c9dc5;
  for (const ch of String(key)) x = Math.imul(x ^ ch.charCodeAt(0), 0x01000193);
  return (x >>> 0) % ROW_COLOURS.length;
}
function colourer() {
  const map = new Map();
  return {
    assign(keys) {  // oldest first
      const inLog = new Set(keys), used = new Set();
      for (const [k, i] of map) if (inLog.has(k)) used.add(i);
      for (const k of keys) {
        if (map.has(k)) continue;
        const start = hashIdx(k), n = ROW_COLOURS.length;
        let i = start;
        for (let j = 0; j < n; j++) if (!used.has((start + j) % n)) { i = (start + j) % n; break; }
        map.set(k, i); used.add(i);

// Retry storms (one or two messages repeating every few seconds) collapse to one line each: an identical
// message within 2 minutes of the same group's oldest copy joins it, so chronology outside a burst is kept.
function collapseEvents(list) {
  const groups = [], open = new Map();

    const key = e.level + "|" + e.text, g = open.get(key);

// Optional PIN (config "pin"): asked for on the first refused change, then kept for this tab only.
const PIN_KEY = "dmrdash.pin";
let pinMem = "";

  const d = $("pindlg"), why = $("pinwhy"), input = $("pinin");
  why.textContent = wrong ? "Wrong PIN. Try again." : "Changes on this hotspot need its dashboard PIN.";
  why.classList.toggle("bad", wrong);

async function post(body) {
  for (let tries = 0; ; tries++) {
    const headers = { "Content-Type": "application/json", "X-Dmrdash": "1" };
    if (pinMem) headers["X-Dmrdash-Pin"] = pinMem;
    const r = await fetch("/api/bm", { method: "POST", headers, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && j.pin && tries < 3) {
      const wrong = Boolean(pinMem);
      setPin("");
      const pin = await askPin(wrong);
      if (!pin) return { ok: false, status: 401, j: { error: "Cancelled: this change needs the dashboard PIN" } };
      setPin(pin);
      continue;
    }
    return { ok: r.ok, status: r.status, j };
  }
}

  const H = W < 600 ? 140 : 170, LM = 36, RM = 12, TM = 34, BM = 20, pw = W - LM - RM, ph = H - TM - BM;

  const yMax = Math.max(6, Math.ceil(Math.max(...shown.map((o) => o.ber))));

  fill($("berkey"), h("span", {}, h("i", { class: "k-dot" }), "One over"), h("span", {}, h("i", { class: "k-drop" }), "Dropped (lost mid-over)"),

function berTip(i) {

  fill(tip,
    h("div", {}, h("b", { class: berClass(o.ber) }, "BER " + pct(o.ber)), o.lost ? " · dropped" : ""),

function setBerOpen(open) {

function say(n, text, err, undo) {
  ui.msg[n] = { text, err, undo };
  const stamp = ui.msg[n];

}

async function act(body, n, okText, undo) {
  if (ui.busy) return false;
  ui.busy = body.action + n + (body.talkgroup ? "/" + body.talkgroup : "");
  ui.msg[n] = { text: "Working…" }; render(true);
  let ok = false;
  try {
    const { ok: done, status, j } = await post(body);
    ok = done;
    say(n, ok ? okText : (j.error || "Failed (HTTP " + status + ")"), !ok, ok ? undo : null);
  } catch (e) { say(n, "Can't reach the dashboard on the Pi", true); }
  ui.busy = null;
  await poll();
  render(true);
  return ok;
}

async function addTG(n, tg) {

setInterval(() => {
  for (const t of document.querySelectorAll(".timer[data-start]")) t.textContent = clockDur(Math.max(0, now() - Number(t.dataset.start)));
  const d = new Date(Date.now() + skew * 1000);

// "Hide kerchunks" is a per-viewer preference, so it lives in this browser's storage

/* ---------------- section order ---------------- */
// Last heard, RF BER and Live log can be put in any order, remembered per browser. The dragged box itself
// never leaves the DOM (its neighbours move round it), so pointer capture and keyboard focus survive.
const deck = document.querySelector(".deck");
const SECTIONS = { heard: "Last heard", ber: "RF BER", log: "Live log" };
function shift(el, before) {
  const con = $("console"), top = con.scrollTop;
  deck.insertBefore(el, before);
  con.scrollTop = L.follow ? con.scrollHeight : top;  // a moved node can lose its scroll position
}
function moveBox(box, to) {
  if ([...deck.children].indexOf(box) === to) return;
  const move = () => {

    for (; i < to; i++) shift(box.nextElementSibling, box);

}
function saveOrder() { try { localStorage.setItem("dmrdash.order", [...deck.children].map((b) => b.dataset.sec).join(",")); } catch (e) {} }

}

  if (v) { scrollBy(0, v); dragTo(y); }

}
function dragEnd() {

}
for (const box of deck.children) {
  const name = SECTIONS[box.dataset.sec];
  const grip = h("button", { class: "grip", type: "button", "aria-label": `Move ${name}`, title: "Drag to move this section, or use the arrow keys",
    "aria-roledescription": "sortable section" }, icon("grip"));

  grip.addEventListener("pointerup", dragEnd);
  grip.addEventListener("pointercancel", dragEnd);
  grip.addEventListener("lostpointercapture", dragEnd);
  grip.addEventListener("keydown", (e) => {

  });

}
